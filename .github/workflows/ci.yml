name: Continuous Integration & MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    name: Linting, Type Safety & Agentic Evaluation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,telemetry,mlops]

      - name: Run Ruff Linter & Format Checks
        run: |
          python -m ruff check .

      - name: Run Mypy Type Safety Verification
        run: |
          python -m mypy continuous_legal_memory

      - name: Run Pytest Fast Unit Test Suite
        run: |
          python -m pytest tests/unit -v --cov=continuous_legal_memory

      - name: Build Wheel & Validate Package Integrity
        run: |
          python -m pip install build twine
          python -m build --wheel
          python -m twine check dist/*

