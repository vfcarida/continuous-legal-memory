site_name: Continuous Legal Memory
site_description: Production-grade, deterministic cognitive memory framework for legal AI agents under the rule of law.
site_author: Vinicius Caridá
site_url: https://vfcarida.github.io/continuous-legal-memory/
repo_url: https://github.com/vfcarida/continuous-legal-memory
repo_name: vfcarida/continuous-legal-memory

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Offline Privacy: getting-started/offline-privacy.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Memory Tiers: architecture/memory-tiers.md
      - Legal Precedence & Conflict Resolution: architecture/legal-precedence.md
      - GDPR Art. 17 Right to Erasure: architecture/gdpr-art17.md
  - Integration Guides:
      - LangChain Memory: guides/langchain-integration.md
      - LlamaIndex Retriever: guides/llamaindex-integration.md
      - Letta (MemGPT) Memory: guides/letta-integration.md
      - HippoRAG Graph Diffusion: guides/hipporag-pagerank.md
      - Multi-Tenancy & Partitioning: guides/multi-tenancy.md
  - API Reference:
      - Orchestrator: reference/api-orchestrator.md
      - Domain Models & Interfaces: reference/models-and-exceptions.md
      - Cryptographic Attestation: reference/attestation.md
  - Evaluation:
      - Benchmark Methodology: evaluation/methodology.md
      - Baseline Report: BASELINE.md
