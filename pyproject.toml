[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-legal-memory"
version = "1.2.0"
description = "Bi-temporal, deontic precedence-aware cognitive memory and cryptographic compliance verification framework for legal AI agents."
readme = "README.md"
authors = [
    { name = "Vinicius Caridá", email = "vfcarida@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "legal-ai",
    "agent-memory",
    "deontic-logic",
    "bitemporal-graph",
    "hipporag",
    "gdpr-article-17",
    "eu-ai-act",
    "model-context-protocol",
    "post-quantum-cryptography",
    "conformal-prediction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.22.0",
    "typing-extensions>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/vfcarida/continuous-legal-memory"
Documentation = "https://vfcarida.github.io/continuous-legal-memory/"
Repository = "https://github.com/vfcarida/continuous-legal-memory.git"
Changelog = "https://github.com/vfcarida/continuous-legal-memory/blob/main/CHANGELOG.md"

[project.scripts]
clm = "continuous_legal_memory.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
mlops = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH"]
ignore = ["E501", "N812", "B905"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-m 'not benchmark'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks full empirical evaluation benchmarks (deselect with '-m \"not benchmark\"')",
    "asyncio: marks coroutine tests executed via asyncio",
]
